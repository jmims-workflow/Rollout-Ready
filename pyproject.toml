[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rollout-ready"
version = "2.0.0"
description = "Test a prompt change before your team sees it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rollout = "rollout_ready.cli:app"

[tool.setuptools]
packages = ["rollout_ready", "rollout_ready.web"]

[tool.setuptools.package-data]
"rollout_ready.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
