name: Discovery follow-up email
description: Turns a rep's discovery call notes into a follow-up email they can send the same day.
who_uses_it: Account executives, right after a discovery call.
input_label: What a rep would paste in
in_use: v2
model: claude-sonnet-5-5
repeats: 1
threshold: 0.5
rubric:
  - id: accurate
    name: Accurate to the notes
    five_looks_like: Every name, number, date and product claim matches the call notes or the product facts.
    one_looks_like: Gets a name, date or product fact wrong, or makes up something nobody said.
  - id: answers
    name: Answers every question asked
    five_looks_like: Each question the customer asked gets a clear, correct answer, in the order they asked it.
    one_looks_like: Skips the customer's questions or brushes them off with a vague offer to help.
  - id: next_step
    name: One clear next step (what, who, when)
    five_looks_like: Ends with one specific next step that says what happens, who does it and by when.
    one_looks_like: No next step, or a vague one like "let me know" with no owner or date.
  - id: length
    name: Right length for a busy reader
    five_looks_like: Can be read in under a minute and has nothing that could be cut.
    one_looks_like: Long and padded, or so short it leaves out what the reader needs.
  - id: person
    name: Sounds like a person
    five_looks_like: Reads like a thoughtful rep wrote it to this customer, warm, plain and specific.
    one_looks_like: Reads like a template, stiff, generic or full of sales cliches.
checks:
  - type: max_words
    value: 150
    label: Under 150 words
  - type: must_not_contain
    value: ["\u2014"]
    label: No em dashes
  - type: must_contain_any
    value: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, January, February, March, April, June, July, August, September, October, November, December]
    label: Names a date or day for the next step
