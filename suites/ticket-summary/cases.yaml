- id: pinecrest-offline-queue
  name: Messages stuck after going offline
  label: Pinecrest Hauling
  input: |
    Ticket #4821, Connect, Pinecrest Hauling
    Customer (Maria Santos, Fleet Supervisor): Drivers say messages they write in dead zones never send. They come back into coverage and the message just sits there with a clock icon. Happening to at least 6 of our 30 drivers, all on iPhones.
    Agent (Leo): Thanks Maria. Which app version are they on? Can they try force-closing the app once they're back in coverage?
    Customer: Version 5.2.1. Force-closing sends them, but drivers don't know to do that and they're driving.
    Agent: Understood. I reproduced it on an iPhone 14 with iOS 18: airplane mode on, send a message, airplane mode off. Message stays queued until the app is restarted. Android does not do this.
    Customer: We need this fixed before our winter routes start December 1.
- id: granite-sso-loop
  name: Sign-in loop after password reset
  label: Granite Peak Clinics
  input: |
    Ticket #4835, Connect, Granite Peak Clinics
    Customer (Ben Archer, IT Manager): Since Monday, anyone who resets their password gets stuck in a loop. They sign in through our single sign-on, land back on the Connect sign-in page, and it starts over.
    Agent (Priya): Hi Ben. Does it happen in the FlowOS web app too, or only Connect?
    Customer: FlowOS is fine. Only Connect. Web and mobile.
    Agent: Thanks. Clearing cookies didn't help on my test account. Signing in from a private browser window works once, then loops again next time.
    Customer: About 15 front desk staff have reset passwords this week. They're messaging from personal phones for now, which our compliance team is not happy about.
- id: bayside-duplicate-push
  name: Duplicate push notifications
  label: Bayside Movers
  input: |
    Ticket #4840, Connect, Bayside Movers
    Customer (Kim Tran): Every message shows up as two notifications on Android. Annoying, not urgent.
    Agent (Omar): Thanks Kim. Is it every message or just group messages?
    Customer: Group messages only, now that I look. Direct messages are fine.
    Agent: Reproduced on a Pixel 8, Connect 5.2.1: send to any group with 3 or more people, the receiver gets two pushes. Reinstalling didn't change it. About 40 dispatchers there use Android.
- id: willow-creek-angry
  name: Angry customer, little detail
  label: Willow Creek Grocers
  input: |
    Ticket #4852, Connect, Willow Creek Grocers
    Customer (Rob Daley, Store Director): CONNECT IS BROKEN AGAIN. Nobody at the Elm Street store can see the shift change announcement. This is the third time this month. Fix it today or we are looking at other vendors.
    Agent (Leo): Sorry Rob, that's frustrating. Can you tell me which announcement and roughly when it was posted?
    Customer: The one I posted this morning around 7. The other two stores got it fine.
    Agent: Thanks. I can see the announcement in our admin view and it went to the Elm Street channel. I've asked Rob for a screenshot from a staff phone. No reply yet. Elm Street has 22 staff on Connect.
- id: coastal-photo-attachments
  name: Photo attachments failing
  label: Coastal Roofing Co.
  input: |
    Ticket #4861, Connect, Coastal Roofing Co.
    Customer (Dee Morales, Office Manager): Crew leads can't send job site photos anymore. They get "Upload failed, try again."
    Agent (Omar): Hi Dee. Are the photos large, or does it fail for every photo?
    Customer: Seems like newer phones. The older iPhones work.
    Agent: I reproduced it: photos over 10 MB fail on iOS and Android with Connect 5.2.1. Under 10 MB is fine. Newer phone cameras often make 12 MB photos. Workaround shared: send at reduced size from the phone's share menu. Dee says the crews are using text messages meanwhile. 8 crew leads affected.
- id: summit-android-crash
  name: Android app crashes on launch
  label: Summit Ridge Transit
  input: |
    Ticket #4877, Connect, Summit Ridge Transit
    Customer (Ali Hassan, Operations Lead): Connect closes the moment it opens on some of our drivers' tablets. Started after an update yesterday.
    Agent (Priya): Hi Ali. Which tablets?
    Customer: The Galaxy Tab A7s. About 25 of them. The newer tablets are fine.
    Agent: We cleared the app cache on one tablet with Ali on the phone. Still crashes. Those tablets run Android 11. Our test Android 13 tablet opens 5.3.0 fine. Ali needs the drivers back on Connect before the Monday morning shift.
