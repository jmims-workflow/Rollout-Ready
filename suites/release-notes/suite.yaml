name: Release note rewriter
description: Turns FlowOS and Insight changelog entries into customer-facing release notes.
who_uses_it: The product marketing team, for the monthly "What's new" page and in-app notes.
input_label: What the marketing team would paste in
in_use: v2
model: claude-sonnet-5-5
repeats: 1
threshold: 0.5
rubric:
  - id: plain
    name: Plain language
    five_looks_like: A customer with no technical background understands it on first read.
    one_looks_like: Full of internal terms, ticket numbers or developer jargon.
  - id: benefit
    name: Says what changes for the customer
    five_looks_like: Leads with what the customer can now do, or no longer has to put up with.
    one_looks_like: Describes the code change, not what it means for the customer.
  - id: accurate
    name: Accurate to the changelog
    five_looks_like: Every claim matches the changelog entry, with nothing added or overstated.
    one_looks_like: Promises something the changelog does not say, or gets a detail wrong.
  - id: length
    name: Right length
    five_looks_like: One or two short sentences, with nothing a customer would skip.
    one_looks_like: Padded with marketing language, or so short the change is unclear.
checks:
  - type: max_words
    value: 60
    label: Under 60 words
  - type: must_not_contain
    value: ["\u2014", "JIRA", "refactor", "backend", "endpoint"]
    label: No em dashes or internal terms
